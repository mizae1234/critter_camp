<!DOCTYPE html>

<html class="light" lang="en"><head>

<style>
        .grid-cell {
            position: relative;
            background-color: transparent;
            transition: background-color 0.2s ease;
        }
        
        .grid-cell::after {
            content: '';
            position: absolute;
            inset: 0;
            border: 1px solid rgba(255, 255, 255, 0.4);
            pointer-events: none;
        }

        /* Irregular Habitat Regions - approximated with background colors on specific cells */
        /* Region 1: Sage */
        .cell-0-0, .cell-0-1, .cell-1-0 { background-color: var(--color-habitat-sage, #748C70); }
        
        /* Region 2: Sand */
        .cell-0-2, .cell-0-3, .cell-1-1, .cell-1-2 { background-color: var(--color-habitat-sand, #D9C5B2); }
        
        /* Region 3: Terracotta */
        .cell-0-4, .cell-0-5, .cell-1-5, .cell-2-5 { background-color: var(--color-habitat-terracotta, #D69E8E); }
        
        /* Region 4: Blue */
        .cell-1-3, .cell-1-4, .cell-2-3, .cell-2-4, .cell-3-4 { background-color: var(--color-habitat-blue, #A8B9C0); }
        
        /* Region 5: Lavender */
        .cell-2-0, .cell-2-1, .cell-3-0, .cell-3-1, .cell-4-0 { background-color: var(--color-habitat-lavender, #B8B5CB); }
        
        /* Region 6: Peach */
        .cell-2-2, .cell-3-2, .cell-3-3, .cell-4-1, .cell-4-2, .cell-4-3, .cell-4-4, .cell-4-5, .cell-5-0, .cell-5-1, .cell-5-2, .cell-5-3, .cell-5-4, .cell-5-5 { background-color: var(--color-habitat-peach, #F4D9C6); }

        /* Outer rounded corners for the grid */
        .cell-0-0 { border-top-left-radius: 1rem; }
        .cell-0-5 { border-top-right-radius: 1rem; }
        .cell-5-0 { border-bottom-left-radius: 1rem; }
        .cell-5-5 { border-bottom-right-radius: 1rem; }
        
        /* Ambient Shadow */
        .shadow-ambient {
            box-shadow: 0 8px 32px rgba(102, 78, 49, 0.05);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md selection:bg-primary-container selection:text-on-primary-container">
<!-- TopAppBar -->
<header class="bg-surface dark:bg-surface-dim docked full-width top-0 flex justify-between items-center px-margin-mobile h-20 w-full z-10">
<div class="flex items-center gap-gutter">
<button aria-label="Go back" class="text-primary dark:text-primary-fixed-dim hover:opacity-80 transition-opacity active:scale-95 duration-150 ease-in-out p-2 rounded-full hover:bg-surface-container-low">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</button>
<div class="flex flex-col">
<h1 class="font-headline-md text-headline-md text-primary dark:text-primary-fixed-dim font-bold tracking-tight">Level 18</h1>
<span class="font-label-sm text-label-sm text-on-surface-variant dark:text-outline-variant">Forest · Medium</span>
</div>
</div>
<div class="flex items-center gap-gutter">
<div class="flex items-center gap-1 bg-surface-container rounded-full px-3 py-1 font-label-bold text-label-bold text-primary">
<span>3/3</span>
<span class="material-symbols-outlined text-[16px] text-habitat-terracotta" style="font-variation-settings: 'FILL' 1;">favorite</span>
</div>
<button aria-label="Settings" class="text-on-surface-variant dark:text-outline-variant hover:opacity-80 transition-opacity active:scale-95 duration-150 ease-in-out p-2 rounded-full hover:bg-surface-container-low">
<span class="material-symbols-outlined text-[24px]">settings</span>
</button>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center justify-center px-margin-mobile py-stack-lg max-w-3xl mx-auto w-full relative z-0">
<!-- Puzzle Grid Area -->
<div class="w-full aspect-square max-w-[400px] mb-stack-lg shadow-ambient rounded-grid overflow-hidden relative bg-surface-cream border-4 border-surface-cream">
<div class="absolute inset-0 grid grid-cols-6 grid-rows-6 gap-0">
<!-- Row 0 -->
<div class="grid-cell cell-0-0"></div><div class="grid-cell cell-0-1"></div><div class="grid-cell cell-0-2"></div><div class="grid-cell cell-0-3"></div><div class="grid-cell cell-0-4"></div><div class="grid-cell cell-0-5"></div>
<!-- Row 1 -->
<div class="grid-cell cell-1-0"></div><div class="grid-cell cell-1-1"></div><div class="grid-cell cell-1-2"></div><div class="grid-cell cell-1-3"></div><div class="grid-cell cell-1-4"></div><div class="grid-cell cell-1-5"></div>
<!-- Row 2 -->
<div class="grid-cell cell-2-0"></div><div class="grid-cell cell-2-1"></div><div class="grid-cell cell-2-2"></div><div class="grid-cell cell-2-3"></div><div class="grid-cell cell-2-4"></div><div class="grid-cell cell-2-5"></div>
<!-- Row 3 -->
<div class="grid-cell cell-3-0"></div><div class="grid-cell cell-3-1"></div><div class="grid-cell cell-3-2"></div><div class="grid-cell cell-3-3"></div><div class="grid-cell cell-3-4"></div><div class="grid-cell cell-3-5"></div>
<!-- Row 4 -->
<div class="grid-cell cell-4-0"></div><div class="grid-cell cell-4-1"></div><div class="grid-cell cell-4-2"></div><div class="grid-cell cell-4-3"></div><div class="grid-cell cell-4-4"></div><div class="grid-cell cell-4-5"></div>
<!-- Row 5 -->
<div class="grid-cell cell-5-0"></div><div class="grid-cell cell-5-1"></div><div class="grid-cell cell-5-2"></div><div class="grid-cell cell-5-3"></div><div class="grid-cell cell-5-4"></div><div class="grid-cell cell-5-5"></div>
</div>
</div>
<!-- Controls Section -->
<div class="w-full max-w-[400px] flex flex-col gap-stack-md">
<!-- Primary Segmented Control -->
<div class="relative flex w-full bg-surface-container rounded-full p-1 shadow-ambient">
<!-- Sliding Indicator (X Mark selected) -->
<div class="absolute inset-y-1 left-1 w-[calc(50%-4px)] bg-primary rounded-full shadow-sm transition-transform duration-300 ease-out z-0"></div>
<button aria-pressed="true" class="flex-1 flex justify-center items-center py-3 relative z-10 font-label-bold text-label-bold text-on-primary transition-colors duration-300">
<span class="material-symbols-outlined mr-2 text-[20px]">close</span>
                    X Mark
                </button>
<button aria-pressed="false" class="flex-1 flex justify-center items-center py-3 relative z-10 font-label-bold text-label-bold text-on-surface-variant hover:text-primary transition-colors duration-300">
<span class="material-symbols-outlined mr-2 text-[20px]">pets</span>
                    Critter
                </button>
</div>
<!-- Sub-controls (Undo, Hint) -->
<div class="flex justify-between items-center w-full px-4">
<button class="flex flex-col items-center justify-center gap-1 text-on-surface-variant hover:text-primary transition-colors active:scale-95">
<div class="w-12 h-12 rounded-full bg-surface-cream flex items-center justify-center shadow-ambient">
<span class="material-symbols-outlined text-[24px]">undo</span>
</div>
<span class="font-label-sm text-label-sm">Undo</span>
</button>
<button class="flex flex-col items-center justify-center gap-1 text-on-surface-variant hover:text-primary transition-colors active:scale-95">
<div class="w-12 h-12 rounded-full bg-surface-cream flex items-center justify-center shadow-ambient">
<span class="material-symbols-outlined text-[24px]">lightbulb</span>
</div>
<span class="font-label-sm text-label-sm">Hint</span>
</button>
</div>
</div>
</main>
<!-- Bottom Nav intentionally suppressed per linear/focused gameplay screen rules -->
</body></html>

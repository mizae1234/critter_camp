<span class="font-body-md text-body-md">Thailand 🇹🇭</span>
</div>
</div>
</section>

<span class="material-symbols-outlined text-habitat-sage text-3xl mb-2" style="font-variation-settings: 'FILL' 1;">map</span>
<span class="font-display-lg text-display-lg text-primary">128</span>
<span class="font-label-bold text-label-bold text-on-surface-variant uppercase tracking-widest mt-1">Journey</span>
</div>
<!-- Streak Stat -->

<span class="material-symbols-outlined text-tertiary text-3xl mb-2" style="font-variation-settings: 'FILL' 1;">local_fire_department</span>

</div>

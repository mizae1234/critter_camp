<script>
        // Subtle Confetti Effect
        function createConfetti() {
            const container = document.getElementById('confetti-container');
            const colors = ['#748C70', '#D9C5B2', '#D69E8E', '#F4D9C6']; // Brand colors
            
            for (let i = 0; i < 30; i++) {
                const confetti = document.createElement('div');
                confetti.classList.add('confetti');
                
                // Randomize properties
                const size = Math.random() * 6 + 4 + 'px';
                const left = Math.random() * 100 + 'vw';
                const duration = Math.random() * 3 + 2 + 's';
                const delay = Math.random() * 2 + 's';
                const color = colors[Math.floor(Math.random() * colors.length)];
                
                confetti.style.width = size;
                confetti.style.height = size;
                confetti.style.left = left;
                confetti.style.top = '-10px';
                confetti.style.backgroundColor = color;
                confetti.style.animationDuration = duration;
                confetti.style.animationDelay = delay;
                
                container.appendChild(confetti);
            }
        }
        
        // Trigger confetti on load
        window.addEventListener('DOMContentLoaded', createConfetti);
    </script>
